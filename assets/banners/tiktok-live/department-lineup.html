<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>LIVE banner: Department Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --orange:#F6B057; --gold:#FCBD3D; --pink:#DE5FB9; --green:#4dff9a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:320px; overflow:hidden; background:transparent; }
body { position:relative; font-family:"Chakra Petch", sans-serif; color:#fff; }
.display { font-family:"Barlow Condensed", sans-serif; font-weight:900; text-transform:uppercase; line-height:.88; }
/* The visible strip; everything outside it is transparent so gameplay shows through */
.strip { position:absolute; left:14px; right:14px; top:44px; bottom:14px; border-radius:30px; overflow:hidden;
  box-shadow: 0 0 0 4px var(--pink), 0 0 30px rgba(222,95,185,.75), 0 10px 30px rgba(0,0,0,.6); }
.logo { position:absolute; left:20px; top:6px; width:250px; z-index:5; filter: drop-shadow(0 8px 18px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(252,189,61,.35)); }
.disc { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(120deg,var(--gold),var(--orange) 45%,var(--pink)); color:#000; font-weight:700; font-size:31px; letter-spacing:.01em;
  box-shadow:0 0 0 3px #000, 0 0 0 6px var(--pink), 0 0 26px rgba(222,95,185,.8); white-space:nowrap; }
.disc svg { width:38px; height:38px; }
.pill { display:inline-flex; align-items:center; gap:10px; padding:7px 18px; border-radius:999px; font-size:26px; font-weight:700; color:var(--green); background:rgba(0,0,0,.55); border:2px solid rgba(77,255,154,.75); white-space:nowrap; }
.dot { width:13px; height:13px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
.url { font-size:24px; font-weight:600; color:var(--gold); white-space:nowrap; }

.strip { background: radial-gradient(600px 260px at 50% 0%, rgba(222,95,185,.4), transparent 70%), #07030b; }
.strip::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(-35deg, rgba(222,95,185,.07) 0 2px, transparent 2px 36px); }
.head { position:absolute; left:276px; top:58px; z-index:3; }
.head h1 { font-size:76px; background:linear-gradient(120deg,var(--gold),var(--orange) 45%,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(4px 5px 0 #000); white-space:nowrap; transform:rotate(-2deg); transform-origin:left; }
.chips { position:absolute; left:276px; right:30px; top:138px; display:flex; gap:10px; z-index:3; }
.chip { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:52px; border-radius:14px; font-family:"Barlow Condensed"; font-weight:900; font-size:30px;
  background:linear-gradient(150deg, color-mix(in srgb, var(--c) 30%, #000), #0a0610); border:2px solid var(--c); box-shadow:0 0 16px -4px var(--c); }
.ci { width:28px; height:28px; color:var(--c); display:grid; place-items:center; } .ci svg { width:26px; height:26px; }
.row { position:absolute; left:276px; right:30px; top:204px; display:flex; align-items:center; justify-content:space-between; z-index:3; }
.row .disc { font-size:28px; padding:10px 20px; } .row .disc svg { width:32px; height:32px; }
</style></head><body>
<div class="strip"></div><img class="logo" src="../../img/logo.png" alt="">
<div class="head display"><h1>Pick your side of LA</h1></div>
<div class="chips"><div class="chip" style="--c:#FCBD3D"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg></span>LAPD</div><div class="chip" style="--c:#F6B057"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 16.8 6.1 20l1.3-6.6L2.5 8.9l6.6-.8z"/></svg></span>LASD</div><div class="chip" style="--c:#F6B057"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22 9 2M20 22 15 2M12 4v3M12 11v3M12 18v3"/></svg></span>CHP</div><div class="chip" style="--c:#DE5FB9"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="13" rx="2"/><path d="M8 8 15 3M9 13h6M9 17h3"/></svg></span>COMMS</div><div class="chip" style="--c:#DE5FB9"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.4.2 4.3 1.9 5 4.9"/></svg></span>CIV</div><div class="chip" style="--c:#DE5FB9"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4l5 16H5z"/><path d="M8.3 9h7.4M6.8 14h10.4M3 21h18"/></svg></span>DOT</div></div>
<div class="row"><div class="pill"><span class="dot"></span>Civilians play today</div><div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.5 2.6 3.8 5.8 3.8 9.5S14.5 18.9 12 21.5c-2.5-2.6-3.8-5.8-3.8-9.5S9.5 5.1 12 2.5z"/></svg>projecttropicsrp.com</div></div>
</body></html>
