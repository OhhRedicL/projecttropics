<style>
:root { --orange:#F6B057; --gold:#FCBD3D; --pink:#DE5FB9; --green:#4dff9a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:320px; overflow:hidden; background:transparent; }
body { position:relative; font-family:"Chakra Petch", sans-serif; color:#fff; }
.display { font-family:"Barlow Condensed", sans-serif; font-weight:900; text-transform:uppercase; line-height:.88; }
/* The visible strip; everything outside it is transparent so gameplay shows through */
.strip { position:absolute; left:14px; right:14px; top:44px; bottom:14px; border-radius:30px; overflow:hidden;
  box-shadow: 0 0 0 4px var(--pink), 0 0 30px rgba(222,95,185,.75), 0 10px 30px rgba(0,0,0,.6); }
.logo { position:absolute; left:20px; top:6px; width:250px; z-index:5; filter: drop-shadow(0 8px 18px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(252,189,61,.35)); }
.disc { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(120deg,var(--gold),var(--orange) 45%,var(--pink)); color:#000; font-weight:700; font-size:31px; letter-spacing:.01em;
  box-shadow:0 0 0 3px #000, 0 0 0 6px var(--pink), 0 0 26px rgba(222,95,185,.8); white-space:nowrap; }
.disc svg { width:38px; height:38px; }
.pill { display:inline-flex; align-items:center; gap:10px; padding:7px 18px; border-radius:999px; font-size:26px; font-weight:700; color:var(--green); background:rgba(0,0,0,.55); border:2px solid rgba(77,255,154,.75); white-space:nowrap; }
.dot { width:13px; height:13px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
.url { font-size:24px; font-weight:600; color:var(--gold); white-space:nowrap; }

.strip { background: linear-gradient(180deg,#1a0720 0%,#3a0c2e 62%,#120414 63%); }
.sun { position:absolute; left:300px; top:40px; width:300px; height:300px; border-radius:50%; background:linear-gradient(180deg,var(--gold),var(--orange) 45%,var(--pink)); opacity:.75; box-shadow:0 0 80px rgba(246,176,87,.6); }
.sky { position:absolute; left:0; top:95px; height:70px; width:100%; }
.floor { position:absolute; left:-300px; right:-300px; top:160px; height:200px; transform:perspective(260px) rotateX(55deg); transform-origin:top;
  background: linear-gradient(rgba(222,95,185,.9) 2px, transparent 2px) 0 0/100% 26px, linear-gradient(90deg, rgba(222,95,185,.7) 2px, transparent 2px) 0 0/48px 100%, #0b0310; }
.shade { position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,0) 0 22%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.75) 70%); }
.title { position:absolute; left:270px; top:66px; transform:rotate(-4deg); transform-origin:left; z-index:3; }
.title .k { font-size:34px; text-shadow:4px 4px 0 #000; }
.title .c { font-size:76px; background:linear-gradient(180deg,#ff9be0,var(--pink) 50%,#b33c90); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 0 1.5px var(--gold)) drop-shadow(0 0 1.5px var(--gold)) drop-shadow(5px 6px 0 #000) drop-shadow(0 0 26px rgba(222,95,185,.7)); white-space:nowrap; }
.right { position:absolute; right:36px; top:70px; display:flex; flex-direction:column; align-items:flex-end; gap:16px; z-index:3; }
.right .disc { font-size:27px; padding:11px 20px; } .right .disc svg { width:34px; height:34px; }
.right .pill { font-size:24px; }
