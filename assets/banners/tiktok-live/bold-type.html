<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>LIVE banner: Bold Type</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --orange:#F6B057; --gold:#FCBD3D; --pink:#DE5FB9; --green:#4dff9a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:320px; overflow:hidden; background:transparent; }
body { position:relative; font-family:"Chakra Petch", sans-serif; color:#fff; }
.display { font-family:"Barlow Condensed", sans-serif; font-weight:900; text-transform:uppercase; line-height:.88; }
/* The visible strip; everything outside it is transparent so gameplay shows through */
.strip { position:absolute; left:14px; right:14px; top:44px; bottom:14px; border-radius:30px; overflow:hidden;
  box-shadow: 0 0 0 4px var(--pink), 0 0 30px rgba(222,95,185,.75), 0 10px 30px rgba(0,0,0,.6); }
.logo { position:absolute; left:20px; top:6px; width:250px; z-index:5; filter: drop-shadow(0 8px 18px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(252,189,61,.35)); }
.disc { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(120deg,var(--gold),var(--orange) 45%,var(--pink)); color:#000; font-weight:700; font-size:31px; letter-spacing:.01em;
  box-shadow:0 0 0 3px #000, 0 0 0 6px var(--pink), 0 0 26px rgba(222,95,185,.8); white-space:nowrap; }
.disc svg { width:38px; height:38px; }
.pill { display:inline-flex; align-items:center; gap:10px; padding:7px 18px; border-radius:999px; font-size:26px; font-weight:700; color:var(--green); background:rgba(0,0,0,.55); border:2px solid rgba(77,255,154,.75); white-space:nowrap; }
.dot { width:13px; height:13px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
.url { font-size:24px; font-weight:600; color:var(--gold); white-space:nowrap; }

.strip { background: radial-gradient(500px 260px at 100% 0%, rgba(222,95,185,.45), transparent 70%), radial-gradient(400px 260px at 30% 120%, rgba(252,189,61,.3), transparent 70%), #050208; }
.strip::before { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(252,189,61,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(252,189,61,.08) 2px,transparent 2px); background-size:44px 44px; }
.words { position:absolute; left:282px; top:58px; display:flex; flex-direction:column; gap:2px; font-size:68px; transform:rotate(-3deg); transform-origin:left; z-index:3; white-space:nowrap; }
.words > div { display:flex; gap:16px; }
.words span { filter: drop-shadow(5px 6px 0 #000); }
.w1 { color:#fff; } .w2 { color:var(--gold); } .w3 { color:var(--orange); }
.w4 { background:linear-gradient(180deg,#ff9be0,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.row { position:absolute; left:282px; right:36px; top:208px; display:flex; align-items:center; justify-content:space-between; gap:20px; z-index:3; }
.row .pill { font-size:22px; padding:7px 14px; }
.tag { position:absolute; left:290px; top:232px; z-index:3; font-size:24px; font-weight:700; color:#fff; white-space:nowrap; }
.tag b { color:var(--gold); font-weight:600; }
.row .disc { font-size:27px; padding:11px 20px; } .row .disc svg { width:34px; height:34px; }
.row .t b { color:var(--green); }
</style></head><body>
<div class="strip"></div><img class="logo" src="../../img/logo.png" alt="">
<div class="words display"><div><span class="w1">Patrol.</span><span class="w2">Dispatch.</span></div><div><span class="w3">Build.</span><span class="w4">Belong.</span></div></div>
<div class="row"><div class="pill"><span class="dot"></span>Play today. No application.</div><div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.5 2.6 3.8 5.8 3.8 9.5S14.5 18.9 12 21.5c-2.5-2.6-3.8-5.8-3.8-9.5S9.5 5.1 12 2.5z"/></svg>projecttropicsrp.com</div></div>
</body></html>
