<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Department Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;0,900;1,900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css"><style>
body { background: radial-gradient(900px 600px at 50% 0%, rgba(222,95,185,.4), transparent 65%), radial-gradient(900px 700px at 50% 100%, rgba(252,189,61,.18), transparent 60%), #000; }
.lines { position:absolute; inset:0; background: repeating-linear-gradient(-35deg, rgba(222,95,185,.06) 0 3px, transparent 3px 70px); }
.logo { position:absolute; left:70px; top:150px; width:260px; filter: drop-shadow(0 0 40px rgba(252,189,61,.4)); }
.head { position:absolute; left:360px; right:170px; top:175px; }
.head .k { font-size:40px; font-weight:700; color: var(--gold); }
.head h1 { font-size:132px; margin-top:8px; transform: rotate(-3deg); transform-origin:left; filter: drop-shadow(6px 7px 0 #000); }
.tiles { position:absolute; left:70px; right:170px; top:470px; display:grid; grid-template-columns: 1fr 1fr; gap:26px; }
.tile { position:relative; height:205px; padding:24px 26px 22px; border-radius:28px; overflow:hidden;
  background: linear-gradient(150deg, color-mix(in srgb, var(--c) 30%, #000), #0a0610 70%); border:3px solid color-mix(in srgb, var(--c) 70%, transparent);
  box-shadow: 0 0 40px -10px var(--c); }
.tile::after { content:""; position:absolute; inset:0; background-image: linear-gradient(rgba(0,0,0,.25) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px); background-size: 28px 28px; opacity:.6; }
.ic { position:relative; z-index:1; width:84px; height:84px; display:grid; place-items:center; border-radius:50%; background:#000; border:3px solid #fff; color: var(--c); }
.ic svg { width:46px; height:46px; }
.ab { position:absolute; z-index:1; right:26px; top:22px; font-size:92px; color:#fff; filter: drop-shadow(4px 5px 0 #000); }
.nm { position:relative; z-index:1; margin-top:22px; font-size:38px; font-weight:700; }
.civnote { position:absolute; left:70px; right:170px; top:1170px; }
.civnote .pill { font-size:36px; }
.cta-wrap { position:absolute; left:70px; right:170px; top:1265px; display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
</style></head><body>
