.sun { position:absolute; left:50%; top:700px; width:760px; height:760px; transform:translateX(-50%); border-radius:50%;

  transform: perspective(500px) rotateX(60deg); transform-origin: top; }

.logo { position:absolute; left:50%; top:150px; width:400px; transform:translateX(-50%) rotate(-3deg); filter: drop-shadow(0 20px 40px rgba(0,0,0,.7)) drop-shadow(0 0 50px rgba(252,189,61,.35)); }

.panel { position:absolute; left:70px; right:170px; top:1005px; padding:32px 36px; border-radius:34px; background: rgba(0,0,0,.78); border: 3px solid rgba(252,189,61,.55); box-shadow: 0 0 60px rgba(222,95,185,.35); }
.depts { font-size:33px; font-weight:700; line-height:1.3; margin:20px 0 26px; white-space:nowrap; color:#fff; }
.depts span { color: var(--pink); }
.panel .url { margin-top:22px; display:block; }
